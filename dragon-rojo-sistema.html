<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Dragón Rojo - Sistema Gastronómico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0a0a0a;--surface:rgba(18,18,18,.96);--surface-hover:rgba(28,28,28,.98);
--red:#DC2626;--red-dark:#7F1D1D;--red-glow:rgba(220,38,38,.35);
--gold:#D4A843;--gold-light:#EBC06D;--gold-glow:rgba(212,168,67,.3);
--cream:#F5E8D0;--cream-dim:rgba(245,232,208,.5);
--green:#16A34A;--green-dark:#064E3B;--amber:#D97706;--radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--cream);min-height:100vh;
background:radial-gradient(ellipse at 50% -10%,rgba(220,38,38,.18) 0%,transparent 60%),radial-gradient(ellipse at 80% 50%,rgba(212,168,67,.06) 0%,transparent 50%),var(--bg)}
h1,h2,h3{font-family:'Playfair Display',serif}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--red-dark);border-radius:3px}
.btn{padding:11px 24px;border:1px solid rgba(212,168,67,.4);border-radius:12px;background:linear-gradient(145deg,var(--red-dark),var(--red));color:var(--cream);font-family:'Inter',sans-serif;font-weight:600;font-size:.9rem;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);box-shadow:0 2px 8px var(--red-glow);letter-spacing:.3px}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px var(--red-glow);filter:brightness(1.1)}
.btn-sm{padding:7px 14px;font-size:.82rem;border-radius:8px}
.btn-green{background:linear-gradient(145deg,var(--green-dark),var(--green));box-shadow:0 2px 8px rgba(22,163,74,.3)}
.btn-amber{background:linear-gradient(145deg,#78350F,var(--amber));box-shadow:0 2px 8px rgba(217,119,6,.3)}
.btn-gold{background:linear-gradient(145deg,#92702a,var(--gold));color:#111;box-shadow:0 2px 8px var(--gold-glow)}
.btn-outline{background:transparent;color:var(--gold);box-shadow:none}
.btn-outline:hover{background:rgba(212,168,67,.1)}
.btn:active{transform:translateY(0);box-shadow:0 2px 8px var(--red-glow)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.card{background:linear-gradient(145deg,rgba(20,20,20,.95),rgba(14,14,14,.98));border:1px solid rgba(212,168,67,.15);border-radius:var(--radius);padding:22px;backdrop-filter:blur(10px);box-shadow:0 4px 24px rgba(0,0,0,.3);transition:all .3s cubic-bezier(.4,0,.2,1)}
.card:hover{border-color:rgba(212,168,67,.3);box-shadow:0 8px 32px rgba(0,0,0,.4);transform:translateY(-1px)}
.card-gold{border-color:var(--gold)}
input,select,textarea{background:rgba(10,10,10,.8);border:1px solid rgba(212,168,67,.2);border-radius:10px;padding:12px 16px;color:var(--cream);font-family:'Inter',sans-serif;font-size:.92rem;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,168,67,.15)}
input::placeholder,textarea::placeholder{color:rgba(245,232,208,.35)}
select option{background:#111;color:var(--cream)}
label{font-size:.85rem;color:var(--gold);margin-bottom:4px;display:block;font-weight:500}
.header{background:linear-gradient(145deg,rgba(12,12,12,.98),rgba(8,8,8,.99));border-bottom:1px solid rgba(212,168,67,.15);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.header h1{font-size:1.2rem;color:var(--gold);display:flex;align-items:center;gap:12px}
.role-badge{font-size:.72rem;background:linear-gradient(135deg,var(--red-dark),var(--red));padding:5px 14px;border-radius:20px;border:1px solid rgba(212,168,67,.3);font-family:'Inter',sans-serif;font-weight:600;letter-spacing:.5px}
.tabs{display:flex;gap:6px;padding:12px 24px;flex-wrap:wrap;border-bottom:1px solid rgba(212,168,67,.08);background:rgba(8,8,8,.9)}
.tab{padding:9px 20px;border-radius:10px;cursor:pointer;font-size:.88rem;font-weight:500;background:transparent;color:var(--cream-dim);border:1px solid transparent;transition:all .25s;position:relative;font-family:'Inter',sans-serif}
.tab:hover{color:var(--cream);background:rgba(255,255,255,.03)}
.tab.active{background:linear-gradient(145deg,var(--red-dark),var(--red));color:var(--cream);border-color:rgba(212,168,67,.4);box-shadow:0 2px 12px var(--red-glow)}
.tab .notif-badge{position:absolute;top:-5px;right:-5px;background:var(--gold);color:#111;font-size:.6rem;font-weight:800;padding:2px 6px;border-radius:10px;animation:pulse-badge 1.5s ease-in-out infinite}
@keyframes pulse-badge{0%,100%{transform:scale(1)}50%{transform:scale(1.25);box-shadow:0 0 10px var(--gold-glow)}}
.main{padding:20px 24px;max-width:1400px;margin:0 auto}
.section{display:none}.section.active{display:block}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-card{width:400px;max-width:95vw;text-align:center}
.login-card h1{font-size:1.8rem;color:var(--gold);margin:12px 0 4px}
.login-card p{color:var(--cream-dim);margin-bottom:24px;font-size:.9rem}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.role-btn{padding:16px;border-radius:14px;cursor:pointer;text-align:center;background:var(--surface);border:1.5px solid rgba(212,168,67,.15);color:var(--cream);transition:all .25s;font-family:'Inter',sans-serif}
.role-btn:hover,.role-btn.sel{border-color:var(--gold);background:rgba(220,38,38,.1);box-shadow:0 0 16px var(--red-glow)}
.role-btn .ri{font-size:1.5rem;display:block;margin-bottom:6px}
.mesas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.mesa-cell{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:.9rem;transition:all .25s cubic-bezier(.4,0,.2,1);border:2px solid}
.mesa-cell.libre{background:linear-gradient(145deg,rgba(22,163,74,.15),rgba(6,78,59,.2));border-color:var(--green);box-shadow:0 0 12px rgba(22,163,74,.2)}
.mesa-cell.ocupada{background:linear-gradient(145deg,rgba(220,38,38,.15),rgba(127,29,29,.2));border-color:var(--red);box-shadow:0 0 12px var(--red-glow)}
.mesa-cell.cuenta{background:linear-gradient(145deg,rgba(212,168,67,.2),rgba(212,168,67,.1));border-color:var(--gold);animation:blink-cuenta 1.2s ease-in-out infinite}
.mesa-cell.reservada{background:linear-gradient(145deg,rgba(56,189,248,.15),rgba(14,116,144,.2));border-color:#38BDF8;box-shadow:0 0 12px rgba(56,189,248,.25)}
@keyframes blink-cuenta{0%,100%{opacity:1;box-shadow:0 0 20px var(--gold-glow)}50%{opacity:.35;box-shadow:0 0 4px rgba(212,168,67,.1)}}
.mesa-cell:hover{transform:scale(1.06)}
.mesa-cell .mn{font-size:1.1rem}.mesa-cell .ms{font-size:.62rem;margin-top:2px;opacity:.7}
.order-card{margin-bottom:12px;padding:18px;border-left:4px solid var(--gold);transition:all .25s ease}
.order-card:hover{border-left-width:6px;background:linear-gradient(145deg,rgba(25,25,25,.98),rgba(18,18,18,1))}
.order-card.nuevo{border-left-color:var(--red)}.order-card.preparando{border-left-color:var(--amber)}.order-card.listo{border-left-color:var(--green)}.order-card.entregado{border-left-color:#38BDF8;opacity:.6}
.status-entregado{background:rgba(56,189,248,.2);color:#7DD3FC}
.oc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.oc-mesa{font-size:1.1rem;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif}
.oc-time{font-size:.78rem;opacity:.6}.oc-items{margin:8px 0}.oc-item{padding:3px 0;font-size:.9rem}
.oc-status{display:inline-block;padding:4px 12px;border-radius:8px;font-size:.78rem;font-weight:700}
.status-nuevo{background:rgba(220,38,38,.2);color:#f87171}.status-preparando{background:rgba(217,119,6,.2);color:#fbbf24}.status-listo{background:rgba(22,163,74,.2);color:#4ade80}
.oc-notas{font-size:.82rem;color:var(--gold-light);background:rgba(212,168,67,.08);padding:6px 10px;border-radius:8px;margin-top:6px;border-left:3px solid var(--gold)}
.elapsed-time{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:8px}
.elapsed-green{background:rgba(22,163,74,.15);color:#4ade80}.elapsed-amber{background:rgba(217,119,6,.15);color:#fbbf24}.elapsed-red{background:rgba(220,38,38,.2);color:#f87171}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.menu-item{overflow:hidden}.menu-item img{width:100%;height:160px;object-fit:cover;border-radius:14px 14px 0 0;margin:-22px -22px 12px;width:calc(100% + 44px)}
.mi-cat{font-size:.7rem;color:var(--red);text-transform:uppercase;letter-spacing:1.2px;font-weight:600}
.mi-name{font-size:1.05rem;font-weight:700;margin:4px 0;font-family:'Playfair Display',serif}
.mi-price{color:var(--gold);font-size:1.1rem;font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex;animation:modalFadeIn .2s ease-out}
@keyframes modalFadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalSlideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal{background:linear-gradient(145deg,#141414,#0e0e0e);border:1px solid rgba(212,168,67,.25);border-radius:var(--radius);padding:28px;max-width:540px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:modalSlideUp .3s cubic-bezier(.34,1.56,.64,1)}
.modal h2{color:var(--gold);margin-bottom:16px;font-size:1.2rem}.close-modal{float:right;background:none;border:none;color:var(--cream);font-size:1.4rem;cursor:pointer}
.cobro-table{width:100%;border-collapse:collapse;margin:12px 0}.cobro-table th,.cobro-table td{padding:8px 12px;text-align:left;border-bottom:1px solid rgba(212,168,67,.1)}.cobro-table th{color:var(--gold);font-size:.82rem}
.cobro-total{font-size:1.4rem;color:var(--gold);font-weight:700;text-align:right;margin:12px 0;font-family:'Playfair Display',serif}
.reserva-row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid rgba(212,168,67,.08);gap:10px}
.reserva-row:last-child{border:none}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);background:var(--surface);color:var(--cream);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.qty button:hover{background:var(--red-dark)}
.qty span{min-width:20px;text-align:center;font-weight:700}
.promo-badge{position:absolute;top:12px;right:12px;background:linear-gradient(135deg,var(--red),#B91C1C);padding:5px 14px;border-radius:8px;font-weight:700;font-size:.85rem;box-shadow:0 2px 8px var(--red-glow)}
.notif-bell{position:relative;cursor:pointer;font-size:1.3rem;transition:transform .2s}
.notif-bell:hover{transform:scale(1.15)}
.notif-bell .ncount{position:absolute;top:-8px;right:-10px;background:var(--red);color:white;font-size:.6rem;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;animation:pulse-badge 1.5s ease-in-out infinite;font-family:'Inter',sans-serif}
.mesa-notif{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--gold);animation:pulse-badge 1s ease-in-out infinite}
@media(max-width:900px){.modal{max-width:95vw;padding:20px}.card{padding:16px}}
@media(max-width:600px){.mesas-grid{grid-template-columns:repeat(5,1fr);gap:6px}.mesa-cell{font-size:.75rem;border-radius:10px}.menu-grid{grid-template-columns:1fr}.tabs{gap:4px;padding:10px 12px}.tab{padding:6px 12px;font-size:.8rem}.main{padding:14px 12px}.reserva-row{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap">
<div class="login-card card card-gold">
<img id="loginLogo" style="height:80px;border-radius:16px;box-shadow:0 0 30px var(--red-glow);">
<h1>El Dragón Rojo</h1>
<p>Sistema Gastronómico</p>
<div class="role-grid">
<div class="role-btn" data-role="admin" onclick="selectRole('admin')"><span class="ri">&#128119;</span>Admin</div>
<div class="role-btn" data-role="mozo" onclick="selectRole('mozo')"><span class="ri">&#128116;</span>Mozo</div>
<div class="role-btn" data-role="cocina" onclick="selectRole('cocina')"><span class="ri">&#127859;</span>Cocina</div>
<div class="role-btn" data-role="barra" onclick="selectRole('barra')"><span class="ri">&#127864;</span>Barra</div>
<div class="role-btn" data-role="cliente" onclick="selectRole('cliente')" style="grid-column:span 2"><span class="ri">&#128100;</span>Cliente</div>
</div>
<div id="pinWrap" style="display:none;margin-bottom:16px;">
<label>PIN de acceso</label>
<input type="password" id="pinInput" maxlength="4" placeholder="****" style="text-align:center;font-size:1.4rem;letter-spacing:8px;">
</div>
<button class="btn" onclick="doLogin()" style="width:100%;">Ingresar</button>
<p id="loginError" style="color:var(--red);margin-top:10px;font-size:.85rem;display:none;">PIN incorrecto</p>
</div>
</div>

<div id="appScreen" style="display:none;">
<div class="header">
<h1><img id="headerLogo" style="height:42px;border-radius:10px;"> El Dragón Rojo</h1>
<div style="display:flex;align-items:center;gap:12px;">
<div id="mozoNotifBell" class="notif-bell" style="display:none;" onclick="toggleNotifPanel()">&#128276;<span class="ncount" id="notifCount" style="display:none;">0</span></div>
<div id="notifDropdown" style="display:none;position:absolute;top:56px;right:20px;width:340px;max-height:400px;overflow-y:auto;z-index:150;background:linear-gradient(145deg,#141414,#0e0e0e);border:1px solid rgba(212,168,67,.3);border-radius:16px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.6)"></div>
<span class="role-badge" id="roleBadge"></span>
<button class="btn btn-sm btn-outline" onclick="logout()">Salir</button>
</div>
</div>
<div class="tabs" id="tabsBar"></div>
<div class="main" id="mainContent"></div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
<div class="modal" id="modalContent"></div>
</div>

let currentRole=null,currentTab=null;

function lsGet(k,d){try{const v=localStorage.getItem('dr_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){localStorage.setItem('dr_'+k,JSON.stringify(v))}
function getMenu(){return lsGet('custom_menu',null)||MENU_DATA}
function saveMenu(m){lsSet('custom_menu',m);bc.postMessage({type:'menu'})}
function initMesas(){if(!lsGet('mesas',null)){const m=[];for(let i=1;i<=30;i++)m.push({id:i,status:'libre'});lsSet('mesas',m)}}
function getMesas(){return lsGet('mesas',[])}
function setMesas(m){lsSet('mesas',m);bc.postMessage({type:'mesas'})}
function getOrders(){return lsGet('orders',[])}
function setOrders(o){lsSet('orders',o);bc.postMessage({type:'orders'})}
function addOrder(o){const orders=getOrders();orders.unshift(o);setOrders(orders);if(currentRole==='cocina'&&o.dest==='cocina')playBeep();if(currentRole==='barra'&&o.dest==='barra')playBeep()}
function getCobros(){return lsGet('cobros',[])}
function addCobro(c){const cobros=getCobros();cobros.unshift(c);lsSet('cobros',cobros)}
function getReservas(){return lsGet('reservas',[])}
function setReservas(r){lsSet('reservas',r);bc.postMessage({type:'reservas'})}
function getPromos(){return lsGet('promos',[])}
function setPromos(p){lsSet('promos',p);bc.postMessage({type:'promos'})}
function getMozoNotifs(){const n=lsGet('mozo_notifs',[]);return n.filter(x=>Date.now()-(x.createdAt||Date.now())<24*3600*1000).slice(0,50)}
function setMozoNotifs(n){lsSet('mozo_notifs',n.slice(0,50));bc.postMessage({type:'mozo_notifs'})}

const bc=new BroadcastChannel('dragon_rojo_sync');
let prevUnread=0;
bc.onmessage=(e)=>{if(currentTab)renderCurrentTab();updateNotifBell();if(currentRole==='mozo'&&e.data&&e.data.type==='mozo_notifs'){const nr=getMozoNotifs().filter(x=>!x.read).length;if(nr>prevUnread)playBeep();prevUnread=nr}};
window.addEventListener('storage',e=>{if(e.key&&e.key.startsWith('dr_')&&currentTab){renderCurrentTab();updateNotifBell()}});

function playBeep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;o.type='square';g.gain.setValueAtTime(.3,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3);o.start(c.currentTime);o.stop(c.currentTime+.3)}catch(e){}}

function formatElapsed(ts){
const mins=Math.floor((Date.now()-ts)/60000);
if(mins<1)return'<span class="elapsed-time elapsed-green">Recién</span>';
if(mins<=5)return`<span class="elapsed-time elapsed-green">⏱ ${mins} min</span>`;
if(mins<=15)return`<span class="elapsed-time elapsed-amber">⏱ ${mins} min</span>`;
return`<span class="elapsed-time elapsed-red">⏱ ${mins} min</span>`;
}

let selectedRole=null;
function selectRole(r){selectedRole=r;document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('sel'));document.querySelector(`.role-btn[data-role="${r}"]`).classList.add('sel');const pw=document.getElementById('pinWrap'),pi=document.getElementById('pinInput');if(r==='cliente'){pw.style.display='none';pi.value=''}else{pw.style.display='block';pi.value='';pi.focus()}document.getElementById('loginError').style.display='none'}
function doLogin(){if(!selectedRole){alert('Seleccioná un rol');return}if(selectedRole==='cliente'){currentRole='cliente';startApp();return}const pin=document.getElementById('pinInput').value;if(pin===PINS[selectedRole]){currentRole=selectedRole;startApp()}else{document.getElementById('loginError').style.display='block'}}
document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
function logout(){currentRole=null;currentTab=null;document.getElementById('appScreen').style.display='none';document.getElementById('loginScreen').style.display='flex';document.getElementById('pinInput').value='';document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('sel'));document.getElementById('pinWrap').style.display='none';selectedRole=null}

const ROLE_TABS={
admin:['Mapa de Mesas','Salón y Agenda','Reservas','Carta Digital','Gestión Carta','Promos del Dia','Pedidos','Cobros','Pantalla Cocina','Pantalla Barra'],
mozo:['Mapa de Mesas','Tomar Pedido','Mis Mesas','Promos del Dia','Solicitar Cobro'],
cocina:['Pantalla Cocina'],barra:['Pantalla Barra'],
cliente:['Carta Digital','Promos del Dia','Hacer Reserva']
};

function startApp(){document.getElementById('loginScreen').style.display='none';document.getElementById('appScreen').style.display='block';document.getElementById('roleBadge').textContent=currentRole.toUpperCase();if(currentRole==='mozo')document.getElementById('mozoNotifBell').style.display='block';else document.getElementById('mozoNotifBell').style.display='none';renderTabs();switchTab(ROLE_TABS[currentRole][0])}
function updateNotifBell(){if(currentRole!=='mozo')return;const n=getMozoNotifs().filter(x=>!x.read).length;const bell=document.getElementById('notifCount');if(n>0){bell.style.display='flex';bell.textContent=n}else{bell.style.display='none';document.getElementById('notifDropdown').style.display='none'}}
function toggleNotifPanel(){const dd=document.getElementById('notifDropdown');if(dd.style.display==='block'){dd.style.display='none';return}const notifs=getMozoNotifs().filter(n=>!n.read);if(notifs.length===0){switchTab('Mis Mesas');return}dd.innerHTML=`<h3 style="color:var(--gold);margin-bottom:12px;font-size:1rem">🔔 Pedidos Listos</h3>${notifs.map(n=>`<div style="padding:10px;border-bottom:1px solid rgba(212,168,67,.1);display:flex;justify-content:space-between;align-items:start"><div><strong style="color:var(--gold-light)">Mesa ${n.mesa}</strong> <span style="font-size:.8rem;opacity:.6">${n.dest==='cocina'?'🍳':'🍸'}</span><div style="font-size:.82rem;opacity:.7;margin-top:2px">${n.items||'Pedido'}</div></div><span style="font-size:.75rem;opacity:.5;white-space:nowrap">${n.time}</span></div>`).join('')}<button class="btn btn-sm btn-gold" style="width:100%;margin-top:12px" onclick="markAllNotifsRead()">✓ Marcar todo como visto</button>`;dd.style.display='block'}
function markAllNotifsRead(){const n=getMozoNotifs();n.forEach(x=>x.read=true);setMozoNotifs(n);document.getElementById('notifDropdown').style.display='none';renderTabs();if(currentTab==='Mis Mesas')renderCurrentTab()}
function renderTabs(){const bar=document.getElementById('tabsBar');const unread=currentRole==='mozo'?getMozoNotifs().filter(x=>!x.read).length:0;bar.innerHTML=ROLE_TABS[currentRole].map(t=>{let label=t;let badge='';if(t==='Mis Mesas'&&unread>0)badge=`<span class="notif-badge">${unread}</span>`;return`<div class="tab${currentTab===t?' active':''}" onclick="switchTab('${t}')">${label}${badge}</div>`}).join('');updateNotifBell()}
function switchTab(t){currentTab=t;renderTabs();renderCurrentTab()}
function renderCurrentTab(){const m=document.getElementById('mainContent');switch(currentTab){case'Mapa de Mesas':renderMesas(m);break;case'Salón y Agenda':renderSalon(m);break;case'Reservas':renderReservas(m);break;case'Carta Digital':renderCarta(m);break;case'Gestión Carta':renderGestion(m);break;case'Promos del Dia':renderPromos(m);break;case'Pedidos':renderPedidos(m);break;case'Cobros':renderCobros(m);break;case'Pantalla Cocina':renderCocina(m);break;case'Pantalla Barra':renderBarra(m);break;case'Tomar Pedido':renderTomarPedido(m);break;case'Mis Mesas':renderMisMesas(m);break;case'Solicitar Cobro':renderSolicitarCobro(m);break;case'Hacer Reserva':renderHacerReserva(m);break}}

// MESAS
function renderMesas(el){const mesas=getMesas();const lc=mesas.filter(m=>m.status==='libre').length;const oc=mesas.filter(m=>m.status==='ocupada').length;const cc=mesas.filter(m=>m.status==='cuenta').length;const rc=mesas.filter(m=>m.status==='reservada').length;
el.innerHTML=`<h2 style="color:var(--gold);margin-bottom:16px">Mapa de Mesas</h2><div style="display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;font-size:.85rem"><span>&#128994; Libre: ${lc}</span><span>&#128308; Ocupada: ${oc}</span>${rc?`<span style="color:#38BDF8">📘 Reservada: ${rc}</span>`:''}${cc?`<span>&#128310; Cuenta: ${cc}</span>`:''}</div><div class="mesas-grid">${mesas.map(m=>`<div class="mesa-cell ${m.status}" onclick="toggleMesa(${m.id})"><span class="mn">${m.id}</span><span class="ms">${m.status==='libre'?'Libre':m.status==='cuenta'?'Cuenta':m.status==='reservada'?'Reserv.':'Ocup.'}</span></div>`).join('')}</div><div id="mesaDetail" style="margin-top:20px"></div>`}
function toggleMesa(id){const mesas=getMesas();const m=mesas.find(x=>x.id===id);if(currentRole==='admin'){showMesaDetail(id);return}if(m.status==='libre'){m.status='ocupada'}else if(m.status==='ocupada'){m.status='libre'}setMesas(mesas);renderCurrentTab()}
function showMesaDetail(id){const mesas=getMesas();const m=mesas.find(x=>x.id===id);const orders=getOrders().filter(o=>o.mesa===id);const det=document.getElementById('mesaDetail');let total=0;let ih=orders.map(o=>o.items.map(it=>{total+=it.price*it.qty;return`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:.9rem"><span>${it.qty}x ${it.name}</span><span>$${(it.price*it.qty).toLocaleString()}</span></div>`}).join('')).join('');
const resInfo=getReservas().find(r=>parseInt(r.mesa)===id);det.innerHTML=`<div class="card card-gold"><h3 style="color:var(--gold);margin-bottom:12px">Mesa ${id} — ${m.status.toUpperCase()}</h3>${resInfo&&m.status==='reservada'?`<div style="background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.2);border-radius:10px;padding:10px;margin-bottom:10px;font-size:.85rem"><strong style="color:#38BDF8">${resInfo.nombre}</strong> — ${resInfo.personas} pers. — ${resInfo.fecha||''} ${resInfo.horario}</div>`:''}${orders.length?`<div>${ih}</div><div style="text-align:right;margin-top:8px;font-size:1.2rem;color:var(--gold);font-weight:700">Total: $${total.toLocaleString()}</div>`:'<p style="opacity:.5">Sin pedidos</p>'}<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">${m.status!=='libre'&&m.status!=='reservada'?`<button class="btn btn-sm btn-green" onclick="setMesaStatus(${id},'libre')">Liberar Mesa</button>`:''}<button class="btn btn-sm" onclick="setMesaStatus(${id},'ocupada')">Marcar Ocupada</button>${m.status!=='reservada'?`<button class="btn btn-sm" style="border-color:#38BDF8;color:#38BDF8" onclick="setMesaStatus(${id},'reservada')">Marcar Reservada</button>`:`<button class="btn btn-sm btn-green" onclick="setMesaStatus(${id},'libre')">Liberar Mesa</button>`}${m.status==='cuenta'?`<button class="btn btn-sm btn-gold" onclick="openCobro(${id})">Procesar Cobro</button>`:''}</div></div>`}
function setMesaStatus(id,s){const mesas=getMesas();const m=mesas.find(x=>x.id===id);m.status=s;setMesas(mesas);renderCurrentTab()}

// RESERVAS
function renderReservas(el){const reservas=getReservas();el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="color:var(--gold)">Reservas</h2><button class="btn btn-sm" onclick="openReservaForm()">+ Nueva Reserva</button></div><div class="card">${reservas.length===0?'<p style="opacity:.5">No hay reservas</p>':reservas.map((r,i)=>`<div class="reserva-row"><div><strong style="color:var(--gold-light)">${r.nombre}</strong> — ${r.personas} pers. — Mesa ${r.mesa} — ${r.fecha||'Sin fecha'} ${r.horario}<br><span style="font-size:.82rem;opacity:.6">Tel: ${r.telefono} | Niños: ${r.ninos?'Sí':'No'} | Celíacos: ${r.celiacos?'Sí':'No'}${r.notas?' | '+r.notas:''}</span></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-sm btn-gold" onclick="sendConfirmWA(${i})">Confirmar WA</button><button class="btn btn-sm" style="border-color:#38BDF8;color:#38BDF8" onclick="addReservaToCalendar(${i})">📅</button><button class="btn btn-sm btn-outline" onclick="editReserva(${i})">Editar</button><button class="btn btn-sm" onclick="cancelReserva(${i})">Cancelar</button></div></div>`).join('')}</div>`}
function openReservaForm(idx){const r=idx!==undefined?getReservas()[idx]:null;const mo=Array.from({length:30},(_,i)=>`<option value="${i+1}" ${r&&r.mesa==i+1?'selected':''}>${i+1}</option>`).join('');const ho=HORARIOS.map(h=>`<option value="${h}" ${r&&r.horario===h?'selected':''}>${h}</option>`).join('');const hoy=new Date().toISOString().split('T')[0];openModal(`<h2>${r?'Editar':'Nueva'} Reserva</h2><div style="display:grid;gap:12px"><div><label>Nombre</label><input id="rNombre" value="${r?r.nombre:''}"></div><div><label>Teléfono</label><input id="rTel" value="${r?r.telefono:''}"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>Fecha</label><input type="date" id="rFecha" min="${hoy}" value="${r&&r.fecha?r.fecha:hoy}"></div><div><label>Horario</label><select id="rHorario">${ho}</select></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>Personas</label><input type="number" id="rPersonas" min="1" value="${r?r.personas:'2'}"></div><div><label>Mesa</label><select id="rMesa">${mo}</select></div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px"><div><label>Niños</label><select id="rNinos"><option value="no" ${r&&r.ninos?'':'selected'}>No</option><option value="si" ${r&&r.ninos?'selected':''}>Sí</option></select></div><div><label>Celíacos</label><select id="rCeliacos"><option value="no" ${r&&r.celiacos?'':'selected'}>No</option><option value="si" ${r&&r.celiacos?'selected':''}>Sí</option></select></div></div><div><label>Notas</label><textarea id="rNotas" rows="2">${r?r.notas||'':''}</textarea></div><button class="btn" onclick="saveReserva(${idx!==undefined?idx:-1})">Guardar Reserva</button></div>`)}
function saveReserva(idx){const r={nombre:document.getElementById('rNombre').value,telefono:document.getElementById('rTel').value,fecha:document.getElementById('rFecha').value,personas:document.getElementById('rPersonas').value,mesa:document.getElementById('rMesa').value,horario:document.getElementById('rHorario').value,ninos:document.getElementById('rNinos').value==='si',celiacos:document.getElementById('rCeliacos').value==='si',notas:document.getElementById('rNotas').value};if(!r.nombre||!r.telefono){alert('Completá nombre y teléfono');return}const res=getReservas();if(idx>=0)res[idx]=r;else res.push(r);setReservas(res);closeModal();renderCurrentTab()}
function editReserva(i){openReservaForm(i)}
function cancelReserva(i){if(!confirm('¿Cancelar esta reserva?'))return;const r=getReservas();r.splice(i,1);setReservas(r);renderCurrentTab()}
function sendConfirmWA(i){const r=getReservas()[i];const tel=r.telefono.replace(/[^0-9]/g,'');const t=encodeURIComponent(`🐉 *EL DRAGÓN ROJO — RESERVA CONFIRMADA*\n\nEstimado/a ${r.nombre},\n\nSu reserva ha sido confirmada ✅\n\n📋 *Detalles:*\n📅 Fecha: ${r.fecha||'Hoy'}\n🕐 Horario: ${r.horario}\n🪑 Mesa: ${r.mesa}\n👥 Personas: ${r.personas}\n👶 Niños: ${r.ninos?'Sí':'No'}\n🌾 Celíacos: ${r.celiacos?'Sí':'No'}\n${r.notas?'📝 Notas: '+r.notas+'\n':''}\n⏰ *Tenemos 20 minutos de tolerancia.*\n\n¡Los esperamos! 🐉🔥`);window.open(`https://wa.me/${tel}?text=${t}`,'_blank')}

// CARTA DIGITAL
function renderCarta(el){const menu=getMenu();el.innerHTML=`<h2 style="color:var(--gold);margin-bottom:20px">Carta Digital</h2><div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap"><button class="btn btn-sm btn-gold" onclick="filterCarta('all')">Todos</button>${ALL_CATS.map(c=>`<button class="btn btn-sm btn-outline" onclick="filterCarta('${c}')">${c}</button>`).join('')}</div><div class="menu-grid" id="cartaGrid">${menu.map(it=>`<div class="card menu-item" data-cat="${it.cat}"><img src="${it.img}" alt="${it.name}" loading="lazy" onerror="this.style.display='none'"><div class="mi-cat">${it.cat}</div><div class="mi-name">${it.name}</div><p style="font-size:.82rem;opacity:.6;margin:4px 0">${it.desc||''}</p><div class="mi-price">$${it.price.toLocaleString()}</div></div>`).join('')}</div>`}
function filterCarta(c){document.querySelectorAll('#cartaGrid .menu-item').forEach(el=>{el.style.display=(c==='all'||el.dataset.cat===c)?'block':'none'})}

// GESTION CARTA (Admin)
function renderGestion(el){const menu=getMenu();el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="color:var(--gold)">Gestión de Carta</h2><button class="btn btn-sm" onclick="openMenuItemForm(-1)">+ Agregar Producto</button></div><div class="menu-grid">${menu.map((it,i)=>`<div class="card" style="padding:16px"><img src="${it.img}" style="width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:10px" loading="lazy" onerror="this.style.background='var(--surface)'"><div class="mi-cat">${it.cat}</div><div class="mi-name">${it.name}</div><div class="mi-price" style="margin:6px 0">$${it.price.toLocaleString()}</div><p style="font-size:.8rem;opacity:.5;margin-bottom:10px">${it.desc||''}</p><div style="display:flex;gap:6px"><button class="btn btn-sm btn-gold" onclick="openMenuItemForm(${i})">Editar</button><button class="btn btn-sm btn-outline" onclick="deleteMenuItem(${i})">Eliminar</button></div></div>`).join('')}</div>`}
function openMenuItemForm(idx){const menu=getMenu();const it=idx>=0?menu[idx]:null;const cOpts=ALL_CATS.map(c=>`<option value="${c}" ${it&&it.cat===c?'selected':''}>${c}</option>`).join('');openModal(`<h2>${it?'Editar':'Agregar'} Producto</h2><div style="display:grid;gap:12px"><div><label>Nombre</label><input id="miName" value="${it?it.name:''}"></div><div><label>Categoría</label><select id="miCat">${cOpts}</select></div><div><label>Precio ($)</label><input type="number" id="miPrice" value="${it?it.price:''}"></div><div><label>Descripción</label><textarea id="miDesc" rows="2">${it?it.desc||'':''}</textarea></div><div><label>URL de imagen</label><input id="miImg" value="${it?it.img:''}"></div><button class="btn" onclick="saveMenuItem(${idx})">Guardar</button></div>`)}
function saveMenuItem(idx){const item={name:document.getElementById('miName').value,cat:document.getElementById('miCat').value,price:parseInt(document.getElementById('miPrice').value)||0,desc:document.getElementById('miDesc').value,img:document.getElementById('miImg').value};if(!item.name){alert('Ingresá un nombre');return}const menu=[...getMenu()];if(idx>=0)menu[idx]=item;else menu.push(item);saveMenu(menu);closeModal();renderCurrentTab()}
function deleteMenuItem(idx){if(!confirm('¿Eliminar este producto?'))return;const menu=[...getMenu()];menu.splice(idx,1);saveMenu(menu);renderCurrentTab()}

// PROMOS
function renderPromos(el){const promos=getPromos();const isAdmin=currentRole==='admin';const menu=getMenu();el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="color:var(--gold)">Promos del Día</h2>${isAdmin?'<button class="btn btn-sm" onclick="openPromoForm()">+ Nueva Promo</button>':''}</div>${promos.length===0?'<div class="card"><p style="opacity:.5">No hay promos activas</p></div>':`<div class="menu-grid">${promos.map((p,i)=>{const it=menu.find(m=>m.name===p.item);const disc=it?Math.round(it.price*(1-p.discount/100)):0;return`<div class="card" style="position:relative;overflow:hidden">${it?`<img src="${it.img}" loading="lazy" style="width:calc(100%+44px);height:140px;object-fit:cover;border-radius:14px 14px 0 0;margin:-22px -22px 12px" onerror="this.style.display='none'">`:''}
<div class="promo-badge">-${p.discount}%</div><div class="mi-name">${p.item}</div><p style="font-size:.85rem;margin:4px 0;opacity:.7">${p.description||''}</p>${it?`<div style="display:flex;gap:12px;align-items:center"><span style="text-decoration:line-through;opacity:.4">$${it.price.toLocaleString()}</span><span class="mi-price">$${disc.toLocaleString()}</span></div>`:''}${isAdmin?`<button class="btn btn-sm" style="margin-top:10px" onclick="deletePromo(${i})">Eliminar</button>`:''}</div>`}).join('')}</div>`}`}
function openPromoForm(){const opts=getMenu().map(m=>`<option value="${m.name}">${m.name} ($${m.price.toLocaleString()})</option>`).join('');openModal(`<h2>Nueva Promo</h2><div style="display:grid;gap:12px"><div><label>Item del menú</label><select id="pItem">${opts}</select></div><div><label>Descuento (%)</label><input type="number" id="pDiscount" min="1" max="99" value="20"></div><div><label>Descripción</label><input id="pDesc" placeholder="Ej: ¡Solo hoy!"></div><button class="btn" onclick="savePromo()">Crear Promo</button></div>`)}
function savePromo(){const p={item:document.getElementById('pItem').value,discount:parseInt(document.getElementById('pDiscount').value),description:document.getElementById('pDesc').value};const promos=getPromos();promos.push(p);setPromos(promos);closeModal();renderCurrentTab()}
function deletePromo(i){const p=getPromos();p.splice(i,1);setPromos(p);renderCurrentTab()}

// ORDER CARD renderer
function renderOrderCard(o,i,showControls,showElapsed){
const sc={'Nuevo':'nuevo','En preparación':'preparando','Listo':'listo','Entregado':'entregado'}[o.status]||'nuevo';
const isMozo=currentRole==='mozo';
return`<div class="card order-card ${sc}" style="margin-bottom:12px"><div class="oc-header"><span class="oc-mesa">Mesa ${o.mesa} ${o.dest==='cocina'?'&#127859;':'&#127864;'} ${o.dest}</span><div style="display:flex;gap:8px;align-items:center">${showElapsed&&o.createdAt?formatElapsed(o.createdAt):''}<span class="oc-time">${o.time}</span></div></div><div class="oc-items">${o.items.map(it=>`<div class="oc-item">${it.qty}x ${it.name} <span style="opacity:.4">$${(it.price*it.qty).toLocaleString()}</span></div>`).join('')}</div>${o.notas?`<div class="oc-notas">📝 ${o.notas}</div>`:''}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span class="oc-status status-${sc}">${o.status}</span>${showControls?`<div style="display:flex;gap:6px">${o.status==='Nuevo'?`<button class="btn btn-sm btn-amber" onclick="changeOrderStatus(${i},'En preparación')">🔥 En preparación</button>`:''}${o.status==='En preparación'?`<button class="btn btn-sm btn-green" onclick="changeOrderStatus(${i},'Listo')">✅ Pedido Listo</button>`:''}${o.status==='Listo'&&!isMozo?'<span style="font-size:.82rem;opacity:.5">Esperando mozo</span>':''}${o.status==='Listo'&&isMozo?`<button class="btn btn-sm" style="border-color:#38BDF8;color:#38BDF8" onclick="changeOrderStatus(${i},'Entregado')">🍽️ Entregado</button>`:''}</div>`:''}</div></div>`}
function changeOrderStatus(i,status){const orders=getOrders();if(!orders[i])return;const order=orders[i];order.status=status;setOrders(orders);if(status==='Listo'){const n=getMozoNotifs();n.unshift({mesa:order.mesa,dest:order.dest,items:order.items.map(it=>it.qty+'x '+it.name).join(', '),time:new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}),read:false,createdAt:Date.now()});setMozoNotifs(n);playBeep()}renderCurrentTab()}

// PEDIDOS (Admin)
function renderPedidos(el){const orders=getOrders();el.innerHTML=`<h2 style="color:var(--gold);margin-bottom:16px">Todos los Pedidos</h2><div>${orders.length===0?'<div class="card"><p style="opacity:.5">No hay pedidos</p></div>':orders.map((o,i)=>renderOrderCard(o,i,true,true)).join('')}</div>`}

// COCINA
let lastCC=0;
function renderCocina(el){const allOrders=getOrders();const orders=allOrders.map((o,i)=>({...o,_idx:i})).filter(o=>o.dest==='cocina'&&o.status!=='Entregado');const nc=orders.filter(o=>o.status==='Nuevo').length;if(currentRole==='cocina'&&nc>lastCC)playBeep();lastCC=nc;el.innerHTML=`<h2 style="color:var(--gold);margin-bottom:16px">&#127859; Pantalla Cocina</h2><div>${orders.length===0?'<div class="card"><p style="opacity:.5">Sin pedidos pendientes</p></div>':orders.map(o=>renderOrderCard(o,o._idx,true,true)).join('')}</div>`}

// BARRA
let lastBC=0;
function renderBarra(el){const allOrders=getOrders();const orders=allOrders.map((o,i)=>({...o,_idx:i})).filter(o=>o.dest==='barra'&&o.status!=='Entregado');const nc=orders.filter(o=>o.status==='Nuevo').length;if(currentRole==='barra'&&nc>lastBC)playBeep();lastBC=nc;el.innerHTML=`<h2 style="color:var(--gold);margin-bottom:16px">&#127864; Pantalla Barra</h2><div>${orders.length===0?'<div class="card"><p style="opacity:.5">Sin pedidos pendientes</p></div>':orders.map(o=>renderOrderCard(o,o._idx,true,true)).join('')}</div>`}

// TOMAR PEDIDO (Mozo)
let pedidoCart=[],pedidoMesa=1;
function renderTomarPedido(el){const mesas=getMesas();const menu=getMenu();let h=`<h2 style="color:var(--gold);margin-bottom:16px">Tomar Pedido</h2><div style="display:flex;gap:12px;margin-bottom:20px;align-items:end"><div style="flex:0 0 130px"><label>Mesa</label><select id="pedidoMesaSel" onchange="pedidoMesa=parseInt(this.value)">${mesas.map(m=>`<option value="${m.id}" ${m.id===pedidoMesa?'selected':''}>${m.id} (${m.status==='libre'?'L':m.status==='cuenta'?'$':'O'})</option>`).join('')}</select></div></div>`;
h+=`<div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">${ALL_CATS.map(c=>`<button class="btn btn-sm btn-outline" onclick="filterPMenu('${c}')">${c}</button>`).join('')}</div>`;
h+=`<div id="pMenuGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">`;
menu.forEach((it,idx)=>{const inC=pedidoCart.find(c=>c.name===it.name);const q=inC?inC.qty:0;h+=`<div class="card" data-cat="${it.cat}" style="padding:14px;display:flex;align-items:center;gap:12px"><img src="${it.img}" style="width:54px;height:54px;border-radius:10px;object-fit:cover" loading="lazy" onerror="this.style.display='none'"><div style="flex:1;min-width:0"><div style="font-size:.9rem;font-weight:600">${it.name}</div><div style="font-size:.85rem;color:var(--gold)">$${it.price.toLocaleString()}</div></div><div class="qty"><button onclick="chPQ('${it.name}',${it.price},'${it.cat}',-1)">−</button><span>${q}</span><button onclick="chPQ('${it.name}',${it.price},'${it.cat}',1)">+</button></div></div>`});
h+=`</div>`;
if(pedidoCart.length>0){let total=pedidoCart.reduce((s,it)=>s+it.price*it.qty,0);h+=`<div class="card card-gold" style="margin-top:20px"><h3 style="color:var(--gold);margin-bottom:10px">Resumen — Mesa ${pedidoMesa}</h3>${pedidoCart.map(it=>`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:.9rem"><span>${it.qty}x ${it.name}</span><span>$${(it.price*it.qty).toLocaleString()}</span></div>`).join('')}<div style="text-align:right;margin-top:8px;font-size:1.2rem;color:var(--gold);font-weight:700">Total: $${total.toLocaleString()}</div><div style="margin-top:14px"><label>Notas del pedido</label><textarea id="pedidoNotas" rows="2" placeholder="Ej: sin cebolla, bien cocido, alergia a maní..."></textarea></div><button class="btn" style="width:100%;margin-top:14px" onclick="enviarPedido()">Enviar Pedido</button></div>`}
el.innerHTML=h}
function filterPMenu(c){document.querySelectorAll('#pMenuGrid .card').forEach(el=>{el.style.display=el.dataset.cat===c?'flex':'none'})}
function chPQ(name,price,cat,d){let it=pedidoCart.find(c=>c.name===name);if(!it&&d>0)pedidoCart.push({name,price,cat,qty:1});else if(it){it.qty+=d;if(it.qty<=0)pedidoCart=pedidoCart.filter(c=>c.name!==name)}renderCurrentTab()}
function enviarPedido(){if(!pedidoCart.length)return;pedidoMesa=parseInt(document.getElementById('pedidoMesaSel').value);const now=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});const notas=(document.getElementById('pedidoNotas')||{}).value||'';const mesas=getMesas();const m=mesas.find(x=>x.id===pedidoMesa);if(m&&m.status==='libre')m.status='ocupada';setMesas(mesas);
const food=pedidoCart.filter(it=>FOOD_CATS.includes(it.cat));const drink=pedidoCart.filter(it=>DRINK_CATS.includes(it.cat));
if(food.length)addOrder({mesa:pedidoMesa,dest:'cocina',items:food.map(it=>({name:it.name,qty:it.qty,price:it.price})),status:'Nuevo',time:now,createdAt:Date.now(),mozo:currentRole,notas});
if(drink.length)addOrder({mesa:pedidoMesa,dest:'barra',items:drink.map(it=>({name:it.name,qty:it.qty,price:it.price})),status:'Nuevo',time:now,createdAt:Date.now(),mozo:currentRole,notas});
pedidoCart=[];alert('¡Pedido enviado!');renderCurrentTab()}

// MIS MESAS (Mozo)
function renderMisMesas(el){const allOrd=getOrders();const orders=allOrd.map((o,i)=>({...o,_idx:i})).filter(o=>o.mozo===currentRole);const mesaIds=[...new Set(orders.map(o=>o.mesa))];const notifs=getMozoNotifs();const unreadByMesa={};const notifsByMesa={};notifs.filter(n=>!n.read).forEach(n=>{unreadByMesa[n.mesa]=(unreadByMesa[n.mesa]||0)+1;if(!notifsByMesa[n.mesa])notifsByMesa[n.mesa]=[];notifsByMesa[n.mesa].push(n)});
const unreadNotifs=notifs.filter(n=>!n.read);
let notifPanel='';
if(unreadNotifs.length>0){notifPanel=`<div class="card card-gold" style="margin-bottom:20px"><h3 style="color:var(--gold);margin-bottom:12px">🔔 Pedidos Listos</h3>${unreadNotifs.map(n=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(212,168,67,.1)"><div><strong style="color:var(--gold-light)">Mesa ${n.mesa}</strong> — <span style="font-size:.85rem">${n.dest==='cocina'?'🍳 Cocina':'🍸 Barra'}</span><div style="font-size:.82rem;opacity:.7;margin-top:2px">${n.items||'Pedido completo'}</div></div><div style="text-align:right;font-size:.78rem"><span style="opacity:.5">${n.time}</span><br><button class="btn btn-sm btn-gold" style="margin-top:4px" onclick="dismissNotifs(${n.mesa})">✓ Visto</button></div></div>`).join('')}</div>`}
el.innerHTML=`<h2 style="color:var(--gold);margin-bottom:16px">Mis Mesas</h2>${notifPanel}${mesaIds.length===0?'<div class="card"><p style="opacity:.5">No estás atendiendo mesas</p></div>':mesaIds.map(mid=>{const mo=orders.filter(o=>o.mesa===mid&&o.status!=='Entregado');const entregados=orders.filter(o=>o.mesa===mid&&o.status==='Entregado').length;let total=mo.reduce((s,o)=>s+o.items.reduce((ss,it)=>ss+it.price*it.qty,0),0);const listos=mo.filter(o=>o.status==='Listo').length;const unreads=unreadByMesa[mid]||0;return`<div class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:1.3rem;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif">Mesa ${mid}</div><div style="display:flex;gap:6px;align-items:center">${unreads>0?`<span style="width:12px;height:12px;border-radius:50%;background:var(--gold);display:inline-block;animation:pulse-badge 1s ease-in-out infinite"></span>`:''}<span style="font-size:.85rem">${mo.length} pedido${mo.length>1?'s':''} — $${total.toLocaleString()}</span></div></div><div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;font-size:.78rem">${mo.filter(o=>o.status==='Nuevo').length?`<span class="oc-status status-nuevo">${mo.filter(o=>o.status==='Nuevo').length} nuevo</span>`:''}${mo.filter(o=>o.status==='En preparación').length?`<span class="oc-status status-preparando">${mo.filter(o=>o.status==='En preparación').length} preparando</span>`:''}${listos?`<span class="oc-status status-listo">${listos} listo ✅</span>`:''}${entregados?`<span class="oc-status status-entregado">${entregados} entregado</span>`:''}</div>${mo.filter(o=>o.status==='Listo').map(o=>renderOrderCard(o,o._idx,true,false)).join('')}</div>`}).join('')}`}
function dismissNotifs(mesa){const n=getMozoNotifs();n.forEach(x=>{if(x.mesa===mesa)x.read=true});setMozoNotifs(n);renderTabs();renderCurrentTab()}

// SOLICITAR COBRO (Mozo)
function renderSolicitarCobro(el){const mesas=getMesas().filter(m=>m.status==='ocupada'||m.status==='cuenta');el.innerHTML=`<h2 style="color:var(--gold);margin-bottom:16px">Solicitar Cobro</h2><div class="card">${mesas.length===0?'<p style="opacity:.5">No hay mesas ocupadas</p>':mesas.map(m=>{const orders=getOrders().filter(o=>o.mesa===m.id);let total=orders.reduce((s,o)=>s+o.items.reduce((ss,it)=>ss+it.price*it.qty,0),0);return`<div class="reserva-row"><div><strong style="color:var(--gold-light)">Mesa ${m.id}</strong> — Total: $${total.toLocaleString()} ${m.status==='cuenta'?'<span style="color:var(--amber)">(Cuenta solicitada)</span>':''}</div>${m.status!=='cuenta'?`<button class="btn btn-sm btn-gold" onclick="solicitarCobro(${m.id})">Solicitar Cuenta</button>`:'<span style="font-size:.82rem;opacity:.5">Esperando admin</span>'}</div>`}).join('')}</div>`}
function solicitarCobro(mid){const mesas=getMesas();const m=mesas.find(x=>x.id===mid);if(m){m.status='cuenta';setMesas(mesas)}alert('Cuenta solicitada para Mesa '+mid);renderCurrentTab()}

// COBROS (Admin)
function renderCobros(el){const mesas=getMesas().filter(m=>m.status==='ocupada'||m.status==='cuenta').sort((a,b)=>(a.status==='cuenta'?0:1)-(b.status==='cuenta'?0:1));const cobros=getCobros().slice(0,20);el.innerHTML=`<h2 style="color:var(--gold);margin-bottom:16px">Cobros</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:20px">${mesas.length===0?'<div class="card"><p style="opacity:.5">No hay mesas para cobrar</p></div>':mesas.map(m=>`<div class="card ${m.status==='cuenta'?'mesa-cell cuenta':''}" style="cursor:pointer;text-align:center;aspect-ratio:auto;border-radius:var(--radius)" onclick="openCobro(${m.id})"><div style="font-size:1.3rem;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif">Mesa ${m.id}</div><div style="font-size:.82rem;opacity:.6">${m.status==='cuenta'?'💰 Cuenta solicitada':'Click para cobrar'}</div></div>`).join('')}</div>${cobros.length?`<h3 style="color:var(--gold);margin:20px 0 12px">Historial de Cobros</h3><div class="card"><table class="cobro-table"><thead><tr><th>Mesa</th><th>Hora</th><th>Items</th><th>Desc.</th><th>Método</th><th>Total</th></tr></thead><tbody>${cobros.map(c=>`<tr><td>${c.mesa}</td><td>${new Date(c.timestamp).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}</td><td>${c.items.map(it=>it.qty+'x '+it.name).join(', ')}</td><td>${c.descuento}%</td><td>${c.metodo}</td><td style="color:var(--gold);font-weight:700">$${c.total.toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`:''}<div id="cobroDetail"></div>`}
function openCobro(mid){const orders=getOrders().filter(o=>o.mesa===mid);let items=[];orders.forEach(o=>o.items.forEach(it=>{const ex=items.find(x=>x.name===it.name);if(ex)ex.qty+=it.qty;else items.push({...it})}));let total=items.reduce((s,it)=>s+it.price*it.qty,0);openModal(`<h2>Cobro — Mesa ${mid}</h2><table class="cobro-table"><thead><tr><th>Item</th><th>Cant</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody>${items.map(it=>`<tr><td>${it.name}</td><td>${it.qty}</td><td>$${it.price.toLocaleString()}</td><td>$${(it.price*it.qty).toLocaleString()}</td></tr>`).join('')}</tbody></table><div style="margin:12px 0"><label>Descuento (%)</label><input type="number" id="cobroDesc" min="0" max="100" value="0" onchange="updCT(${total})"></div><div class="cobro-total" id="cobroTD">Total: $${total.toLocaleString()}</div><div style="margin-bottom:14px"><label>Método de pago</label><select id="cobroMet"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option><option>Mercado Pago</option></select></div><button class="btn btn-green" style="width:100%" onclick="cerrarCobro(${mid})">Cerrar Mesa y Cobrar</button>`)}
function updCT(base){const d=parseInt(document.getElementById('cobroDesc').value)||0;document.getElementById('cobroTD').textContent='Total: $'+Math.round(base*(1-d/100)).toLocaleString()}
function cerrarCobro(mid){const mesaOrders=getOrders().filter(o=>o.mesa===mid);let items=[];mesaOrders.forEach(o=>o.items.forEach(it=>{const ex=items.find(x=>x.name===it.name);if(ex)ex.qty+=it.qty;else items.push({...it})}));const base=items.reduce((s,it)=>s+it.price*it.qty,0);const desc=parseInt((document.getElementById('cobroDesc')||{}).value)||0;addCobro({mesa:mid,timestamp:Date.now(),items,descuento:desc,metodo:(document.getElementById('cobroMet')||{}).value||'Efectivo',total:Math.round(base*(1-desc/100))});const orders=getOrders().filter(o=>o.mesa!==mid);setOrders(orders);const mesas=getMesas();const m=mesas.find(x=>x.id===mid);if(m){m.status='libre'}setMesas(mesas);closeModal();alert('Mesa '+mid+' cobrada y liberada');renderCurrentTab()}

// HACER RESERVA (Cliente)
function renderHacerReserva(el){const mo=Array.from({length:30},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');const ho=HORARIOS.map(h=>`<option value="${h}">${h}</option>`).join('');const hoy=new Date().toISOString().split('T')[0];el.innerHTML=`<div style="max-width:500px;margin:0 auto"><div class="card card-gold"><h2 style="color:var(--gold);margin-bottom:16px">Hacer Reserva</h2><div style="display:grid;gap:14px"><div><label>Nombre</label><input id="crN"></div><div><label>Teléfono</label><input id="crT"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>Fecha</label><input type="date" id="crF" min="${hoy}" value="${hoy}"></div><div><label>Horario</label><select id="crH">${ho}</select></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>Personas</label><input type="number" id="crP" min="1" value="2"></div><div><label>Mesa</label><select id="crM">${mo}</select></div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px"><div><label>Niños</label><select id="crNi"><option value="no">No</option><option value="si">Sí</option></select></div><div><label>Celíacos</label><select id="crCe"><option value="no">No</option><option value="si">Sí</option></select></div></div><div><label>Notas</label><textarea id="crNo" rows="2" placeholder="Alergias, cumpleaños, etc."></textarea></div><button class="btn" onclick="enviarReservaCliente()">Enviar Reserva por WhatsApp</button></div></div></div>`}
function enviarReservaCliente(){const n=document.getElementById('crN').value,t=document.getElementById('crT').value;if(!n||!t){alert('Completá nombre y teléfono');return}const d={nombre:n,telefono:t,fecha:document.getElementById('crF').value,personas:document.getElementById('crP').value,mesa:document.getElementById('crM').value,horario:document.getElementById('crH').value,ninos:document.getElementById('crNi').value==='si',celiacos:document.getElementById('crCe').value==='si',notas:document.getElementById('crNo').value};const r=getReservas();r.push(d);setReservas(r);const txt=encodeURIComponent(`🐉 *RESERVA — El Dragón Rojo*\n👤 Nombre: ${d.nombre}\n📱 Tel: ${d.telefono}\n📅 Fecha: ${d.fecha}\n🕐 Horario: ${d.horario}\n👥 Personas: ${d.personas}\n👶 Niños: ${d.ninos?'Sí':'No'}\n🌾 Celíacos: ${d.celiacos?'Sí':'No'}\n🪑 Mesa: ${d.mesa}\n📝 Notas: ${d.notas||'Ninguna'}`);window.open(`https://wa.me/${WA}?text=${txt}`,'_blank')}

// SALON Y AGENDA (Admin)
function renderSalon(el){const mesas=getMesas();const reservas=getReservas();const hoy=new Date().toISOString().split('T')[0];const reservasHoy=reservas.filter(r=>r.fecha===hoy||!r.fecha);const lc=mesas.filter(m=>m.status==='libre').length;const oc=mesas.filter(m=>m.status==='ocupada').length;const rc=mesas.filter(m=>m.status==='reservada').length;const cc=mesas.filter(m=>m.status==='cuenta').length;
el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px"><h2 style="color:var(--gold)">Salón y Agenda</h2><div style="display:flex;gap:8px"><button class="btn btn-sm" style="border-color:#38BDF8;color:#38BDF8" onclick="autoReservarMesas()">📘 Sincronizar Reservas → Mesas</button><button class="btn btn-sm btn-gold" onclick="addAllToCalendar()">📅 Agregar todo a Google Calendar</button></div></div>
<div style="display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;font-size:.85rem"><span>🟢 Libre: ${lc}</span><span>🔴 Ocupada: ${oc}</span><span style="color:#38BDF8">📘 Reservada: ${rc}</span>${cc?`<span>🟡 Cuenta: ${cc}</span>`:''}</div>
<div class="mesas-grid" style="margin-bottom:24px">${mesas.map(m=>{const res=reservasHoy.find(r=>parseInt(r.mesa)===m.id);return`<div class="mesa-cell ${m.status}" onclick="showMesaDetail(${m.id})" style="position:relative"><span class="mn">${m.id}</span><span class="ms">${m.status==='libre'?'Libre':m.status==='cuenta'?'Cuenta':m.status==='reservada'?'Reserv.':'Ocup.'}</span>${res?`<span style="position:absolute;bottom:2px;font-size:.5rem;color:#38BDF8">${res.horario}</span>`:''}</div>`}).join('')}</div>
<h3 style="color:var(--gold);margin-bottom:12px">📅 Agenda de Hoy — ${new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</h3>
${reservasHoy.length===0?'<div class="card"><p style="opacity:.5">No hay reservas para hoy</p></div>':`<div class="card">${HORARIOS.map(h=>{const res=reservasHoy.filter(r=>r.horario===h);if(!res.length)return`<div style="padding:8px 0;border-bottom:1px solid rgba(212,168,67,.05);opacity:.3"><span style="color:var(--gold);font-weight:600">${h}</span> — Sin reservas</div>`;return res.map(r=>`<div style="padding:10px 0;border-bottom:1px solid rgba(212,168,67,.1);display:flex;justify-content:space-between;align-items:center"><div><span style="color:var(--gold);font-weight:700">${h}</span> — <strong style="color:var(--gold-light)">${r.nombre}</strong> — ${r.personas} pers. — Mesa ${r.mesa}<br><span style="font-size:.8rem;opacity:.6">Tel: ${r.telefono}${r.ninos?' | Niños: Sí':''}${r.celiacos?' | Celíacos: Sí':''}${r.notas?' | '+r.notas:''}</span></div><div style="display:flex;gap:4px"><button class="btn btn-sm" style="border-color:#38BDF8;color:#38BDF8;font-size:.75rem" onclick="setMesaStatus(${parseInt(r.mesa)},'reservada');renderCurrentTab()">Reservar Mesa</button><button class="btn btn-sm btn-gold" style="font-size:.75rem" onclick="addReservaToCalendar(${reservas.indexOf(r)})">📅</button></div></div>`).join('')}).join('')}</div>`}
<div id="mesaDetail" style="margin-top:20px"></div>`}
function autoReservarMesas(){const reservas=getReservas();const hoy=new Date().toISOString().split('T')[0];const mesas=getMesas();let count=0;reservas.filter(r=>r.fecha===hoy||!r.fecha).forEach(r=>{const m=mesas.find(x=>x.id===parseInt(r.mesa));if(m&&m.status==='libre'){m.status='reservada';count++}});setMesas(mesas);alert(count+' mesa(s) marcada(s) como reservada(s)');renderCurrentTab()}
function addReservaToCalendar(idx){const r=getReservas()[idx];if(!r)return;const fecha=r.fecha||new Date().toISOString().split('T')[0];const [hh,mm]=r.horario.split(':');const start=`${fecha}T${r.horario}:00`;const endH=String(parseInt(hh)+2).padStart(2,'0');const end=`${fecha}T${endH}:${mm}:00`;const title=encodeURIComponent(`🐉 Reserva: ${r.nombre} - Mesa ${r.mesa}`);const details=encodeURIComponent(`Personas: ${r.personas}\nTeléfono: ${r.telefono}\nNiños: ${r.ninos?'Sí':'No'}\nCelíacos: ${r.celiacos?'Sí':'No'}\nNotas: ${r.notas||'Ninguna'}\n\nEl Dragón Rojo - Sistema Gastronómico`);const dates=`${fecha.replace(/-/g,'')}T${r.horario.replace(':','')}00/${fecha.replace(/-/g,'')}T${endH}${mm}00`;window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${details}&location=El+Dragon+Rojo+Restaurante`,'_blank')}
function addAllToCalendar(){const reservas=getReservas();const hoy=new Date().toISOString().split('T')[0];const todayRes=reservas.filter(r=>r.fecha===hoy||!r.fecha);if(!todayRes.length){alert('No hay reservas para hoy');return}todayRes.forEach((_,i)=>{const idx=reservas.indexOf(todayRes[i]);addReservaToCalendar(idx)});alert(todayRes.length+' reserva(s) abiertas en Google Calendar')}

// MODAL
function openModal(html){document.getElementById('modalContent').innerHTML=`<button class="close-modal" onclick="closeModal()">&times;</button>`+html;document.getElementById('modalOverlay').classList.add('show')}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}

// AUTO REFRESH
setInterval(()=>{if(['Pantalla Cocina','Pantalla Barra','Mis Mesas'].includes(currentTab))renderCurrentTab();if(currentRole==='mozo')updateNotifBell()},3000);
</script>
</body>
</html>
